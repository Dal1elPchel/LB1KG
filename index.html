<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
    <canvas id="game" width="800" height="600"></canvas>

    <div class="controls">
        <div class="control-group">
            <span class="control-label">Масштаб</span>
            <div class="control-buttons">
                <button id="zoomOut" class="ctrl-btn" title="Уменьшить">−</button>
                <button id="zoomIn" class="ctrl-btn" title="Увеличить">+</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Поворот</span>
            <div class="control-buttons">
                <button id="rotateLeft" class="ctrl-btn" title="Повернуть влево">←</button>
                <button id="rotateRight" class="ctrl-btn" title="Повернуть вправо">→</button>
            </div>
        </div>
    </div>
</div>

<script src="index.js" defer type="module"></script>
</body>
</html>
