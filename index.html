<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
    <canvas id="game" width="800" height="600"></canvas>

    <div class="controls">

        <div class="control-group">
            <span class="control-label">Фокальное расстояние</span>
            <div class="slider-wrap">
                <input type="range" id="focalLength" class="slider"
                       min="100" max="3000" step="10" value="600">
                <span id="focalLengthValue" class="slider-value">600</span>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Масштаб</span>
            <div class="control-buttons">
                <button id="zoomOut" class="ctrl-btn" title="Уменьшить">−</button>
                <button id="zoomIn" class="ctrl-btn" title="Увеличить">+</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Влево / Вправо</span>
            <div class="control-buttons">
                <button id="rotateYLeft" class="ctrl-btn" title="Повернуть влево">←</button>
                <button id="rotateYRight" class="ctrl-btn" title="Повернуть вправо">→</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Вверх / Вниз</span>
            <div class="control-buttons">
                <button id="rotateXUp" class="ctrl-btn" title="Наклонить вверх">↑</button>
                <button id="rotateXDown" class="ctrl-btn" title="Наклонить вниз">↓</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Вбок</span>
            <div class="control-buttons">
                <button id="rotateZLeft" class="ctrl-btn" title="Наклонить в один бок">↺</button>
                <button id="rotateZRight" class="ctrl-btn" title="Наклонить в другой бок">↻</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Перемещение</span>
            <div class="control-buttons">
                <button id="moveUp" class="ctrl-btn" title="Переместить вверх">↑</button>
                <button id="moveDown" class="ctrl-btn" title="Переместить вниз">↓</button>
                <button id="moveLeft" class="ctrl-btn" title="Переместить влево">←</button>
                <button id="moveRight" class="ctrl-btn" title="Переместить вправо">→</button>
            </div>
        </div>
    </div>
</div>

<script src="index.js" defer type="module"></script>
</body>
</html>
