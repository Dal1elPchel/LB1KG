<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
    <canvas id="game" width="900" height="700"></canvas>
    <div class="controls">
        <div class="control-buttons">
            <button class="ctrl-btn" id="start">Start</button>
            <button class="ctrl-btn" id="stop">Stop</button>
        </div>
        <div class="counter">Счет: <span id="counter"></span></div>
    </div>

    <div class="modal">
        <div class="modal_text">Проигрыш! Ваш счет: <span id="counter_modal"></span></div>
        <button class="modal_close">&#10005;</button>
    </div>
</div>

<script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }}
</script>
<script src="index.js" defer type="module"></script>
</body>
</html>
