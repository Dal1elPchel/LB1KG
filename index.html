<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
    <canvas id="game" width="900" height="700"></canvas>
    <div class="controls">
        <div class="control-group">
            <span class="control-label">Свет X</span>
            <div class="control-buttons">
                <button class="ctrl-btn" id="lightXMinus" title="Влево">◀</button>
                <button class="ctrl-btn" id="lightXPlus" title="Вправо">▶</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Свет Y</span>
            <div class="control-buttons">
                <button class="ctrl-btn" id="lightYMinus" title="Вниз">▼</button>
                <button class="ctrl-btn" id="lightYPlus" title="Вверх">▲</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Свет Z</span>
            <div class="control-buttons">
                <button class="ctrl-btn" id="lightZMinus" title="Дальше от нас">−</button>
                <button class="ctrl-btn" id="lightZPlus" title="Ближе к нам">+</button>
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">Текстуры</span>
            <div class="control-buttons">
                <button class="ctrl-btn" id="fabricTexture" title="ворс">ворс</button>
                <button class="ctrl-btn" id="metalTexture" title="метал">метал</button>
            </div>
        </div>

    </div>

    <div class="hints">
        <div class="hint"><span class="hint-key">ЛКМ + движение</span> вращение сцены</div>
        <div class="hint"><span class="hint-key">Колёсико</span> масштаб</div>
        <div class="hint"><span class="hint-key">ПКМ + движение</span> сдвиг сцены</div>
        <div class="hint"><span class="hint-key">Зажать кнопку</span> двигать солнце (жёлтый шар)</div>
    </div>
</div>

<script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }}
</script>
<script src="index.js" defer type="module"></script>
</body>
</html>
